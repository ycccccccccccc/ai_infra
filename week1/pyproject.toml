[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aip"
version = "0.1.0"
description = "AI infrastructure learning and performance tools"
requires-python = ">=3.10"
dependencies = ["torch>=2.3"]

[project.scripts]
aip = "aip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

